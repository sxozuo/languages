  desc: "<emoji document_id=5188377234380954537>🪐</emoji> <b>什么是用户机器人 (Userbot)？</b>\n\n<emoji document_id=5472238129849048175>😎</emoji> 用户机器人是<b>第三方程序</b>，它与 Telegram API 交互以<b>代表用户执行自动化任务</b>。用户机器人可用于自动化各种任务，例如<b>发送消息、加入频道、上传媒体文件等</b>。\n\n<emoji document_id=5474667187258006816>😎</emoji> 用户机器人与 Telegram 中的普通机器人不同，它们<b>在用户帐户上运行</b>，而不是在机器人帐户上运行。这意味着它们可以访问更多功能，并且在执行操作方面更具灵活性。\n\n<emoji document_id=5472267631979405211>🚫</emoji> 但重要的是要注意，<b>用户机器人未得到 Telegram 官方支持</b>，其使用可能违反平台的使用条款。因此，<b>用户在使用时应谨慎</b>，并确保他们的帐户上没有执行恶意代码。\n\n"
  no_font: "<emoji document_id=5465665476971471368>❌</emoji> 字体链接或回复在哪里？"
  no_banner: "<emoji document_id=6010394680179562842>😶</emoji> <b>在指定的链接 </b><code>{link}</code><b> 处未找到任何内容。\n\n请检查链接文件的完整性，并确保链接直接指向文件。</b>"
  font_installed: "<emoji document_id=5436040291507247633>🎉</emoji> <b>字体已安装！</b>\n<emoji document_id=5436040291507247633>🎉</emoji> <i>现在您可以愉快地使用它了。</i>"
  incorrect_format_font: "<emoji document_id=5465665476971471368>❌</emoji> <b>字体格式不正确！</b>\n<blockquote>支持的格式 -> otf, ttf</blockquote>"
