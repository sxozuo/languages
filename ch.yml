quickstart:
  base: "🪐 <b>嗨。</b>您的用户机器人 <b>Heroku</b> 已安装。\n\n❓ <b>需要帮助吗？</b>加入 <a href=\"https://t.me/heroku_talks\">我们的支持聊天</a>。我们帮助<b>所有人</b>。\n\n💁‍♀️ <b>快速指南：</b>\n\n1️⃣ <b>输入</b> <code>.help</code> <b>以查看模块列表</b>\n2️⃣ <b>输入</b> <code>.help &lt;模块名称/命令&gt;</code> <b>以查看模块描述</b>\n3️⃣ <b>输入</b> <code>.dlmod &lt;链接&gt;</code> <b>以从链接加载模块</b>\n4️⃣ <b>回复文件输入</b> <code>.loadmod</code> <b>以从文件加载模块</b>\n5️⃣ <b>输入</b> <code>.unloadmod &lt;模块名称&gt;</code> <b>以卸载模块</b>\n\n💡 <b>Heroku 支持来自 Hikka、Friendly-Telegram 和 GeekTG 的模块，以及自己的模块。</b>\n"
  lavhost: "✌️ <b>您的用户机器人已安装在 lavHost 上</b>。加入 @lavhost 以接收重要通知和更新。所有与平台相关的问题应在 @lavhostchat 中提问。"
